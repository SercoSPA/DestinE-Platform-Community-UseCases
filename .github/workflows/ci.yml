name: default

on:
  pull_request:
    branches: [ "main" ]

jobs:

  fire-risk-plotter:
    name: fire-risk-plotter
    runs-on: ubuntu-latest
    env:
      DESPAUTH_USER: ${{ secrets.DESPAUTH_USER }}
      DESPAUTH_PASSWORD: ${{ secrets.DESPAUTH_PASSWORD }}
    steps:
    - name: Clone repo
      uses: actions/checkout@v6
    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: 3.11
        cache: 'pip'
    - name: Install dependencies
      run: pip install -r DeltaTwin/FireRiskPlotter/models/fire-risk-plotter/requirements.txt
    - name: Create forecast
      run: python DeltaTwin/FireRiskPlotter/models/fire-risk-plotter/fire-risk-plotter.py
    - name: Verify forecast output
      run: |
        if [ ! -f firerisk_forecast.gif ]; then
          echo "Error: firerisk_forecast.gif was not created"
          exit 1
        fi
        echo "Success: firerisk_forecast.gif created"
