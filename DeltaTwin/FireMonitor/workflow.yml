    ref: inputs.user

  - id: password
    ref: inputs.password

  - id: country_name
    ref: inputs.country_name

  - id: download_date
    ref: inputs.download_date

  - id: fire_monitor
    ref: models.fire_monitor

  - id: plot
    ref: outputs.fire-monitor-plot

edges:
