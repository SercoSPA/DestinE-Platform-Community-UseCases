      id: user
    to:
      id: fire_monitor
      port: user

  - from:
      id: password
    to:
      id: fire_monitor
      port: password

  - from:
      id: country_name
    to:
      id: fire_monitor
      port: country_name

  - from:
      id: download_date
    to:
      id: fire_monitor
      port: download_date

  - from:
      id: fire_monitor
